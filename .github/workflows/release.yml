name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.
    # ===== TESTING ONLY - REMOVE THIS SECTION AFTER TESTING =====
    branches:
      - github-actions  # Add your test branches here
    # ===== END TESTING SECTION =====
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git-version plugin

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar

      - name: Get version
        id: version
        run: |
          VERSION=$(./gradlew -q showVersion)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

          # Determine if this is a tag or branch push
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "tag_name=test-$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Find JAR file
        id: jar
        run: |
          JAR_FILE=$(find ./build/libs -name "onb-classic-*-all.jar" | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_tag == 'true' && format('Release {0}', steps.version.outputs.version) || format('[TEST] Build {0}', steps.version.outputs.version) }}
          draft: ${{ steps.version.outputs.is_tag == 'false' }}  # Draft for branch pushes, real for tags
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.jar.outputs.jar_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
