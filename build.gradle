buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.baseline:gradle-baseline-java:7.1.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:0.4.10'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.18.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.8.0'
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.73.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.26.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.28.0'
        classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.1.0'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
    id "com.gradleup.shadow" version "9.2.2"
    id "org.openjfx.javafxplugin" version "0.1.0"
    id "com.github.ben-manes.versions" version "0.53.0"
    id 'com.palantir.git-version' version '4.2.0'
}

apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.baseline' //this enables all plugins including checkstyle requirements
apply plugin: 'com.palantir.baseline-checkstyle'
apply plugin: 'com.palantir.baseline-config'
apply plugin: 'com.palantir.baseline-error-prone'
apply plugin: 'com.palantir.baseline-idea'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.external-publish'
apply plugin: 'com.palantir.jdks.latest'

group = 'com.palantir.onb'
version gitVersion()

jar {
    manifest {
        attributes 'Main-Class': 'com.palantir.onb.Core'
    }
}

java {
    modularity.inferModulePath = true
}

// Generate version.properties file from git tags
tasks.register('generateVersionProperties') {
    def outputDir = file("${buildDir}/generated/resources")
    outputs.dir outputDir
    doLast {
        outputDir.mkdirs()
        def propsFile = file("${outputDir}/version.properties")
        propsFile.text = "version=${project.version}\n"
    }
}

processResources {
    dependsOn generateVersionProperties
    from("${buildDir}/generated/resources") {
        include 'version.properties'
    }
}

// Task to show version for scripts/CI
tasks.register('showVersion') {
    doLast {
        println project.version
    }
}

// Task to generate version file for Sphinx documentation
tasks.register('generateDocsVersion') {
    def outputFile = file("${projectDir}/docs/source/_version.py")
    outputs.file outputFile
    outputs.upToDateWhen { false }  // Always regenerate since it depends on git state
    doLast {
        def versionString = project.version.toString()

        // Try to extract X.Y version from tags like "2.3.0" or "2.3.0-1-g1a2b3c4"
        def shortVersion = versionString
        def matcher = (versionString =~ /^(\d+\.\d+)/)
        if (matcher.find()) {
            shortVersion = matcher.group(1)
        }

        outputFile.text = """# Generated by Gradle - DO NOT EDIT
# Version from git tags
version = '${shortVersion}'
release = '${versionString}'
"""
    }
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}
dependencyUpdates {
    // Reject all non stable versions and Tomcat 11.x (pinned to 10.x)
    rejectVersionIf {
        isNonStable(it.candidate.version) ||
                (it.candidate.group == 'org.apache.tomcat.embed' && it.candidate.version.startsWith('11.')) ||
                (it.candidate.group == 'org.apache.tomcat' && it.candidate.version.startsWith('11.'))

    }
}

javafx {
    version = "21.0.9"
    modules = [
        'javafx.controls',
        'javafx.fxml'
    ]
}

tasks.withType(Test) {
    testLogging {
        events 'started', 'passed'
    }
}

// Avoids "Toolchain from `executable` property does not match toolchain from `javaLauncher` property."
// https://stackoverflow.com/questions/75715341/toolchain-from-executable-property-does-not-match-toolchain-from-javalauncher
gradle.taskGraph.whenReady {
    tasks.withType(JavaExec) {
        if (name.endsWith(".main()")) {
            println("Setting executable to java launcher for ${name}")
            it.setExecutable(javaLauncher.get().executablePath.asFile.absolutePath)
        }
    }
}

repositories {
    mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
}

allprojects {
    apply plugin: 'com.palantir.baseline-null-away'
    tasks.withType(JavaCompile) {
    }

    tasks.withType(JavaCompile).configureEach {
        options.errorprone.disable 'JavaTimeSystemDefaultTimeZone'
    }
}

spotless {
    java {
        targetExclude 'src/main/java/com/palantir/onb/tftp/commons/**'
    }
}

tasks.checkstyleMain.dependsOn(baselineUpdateConfig)
tasks.checkstyleTest.dependsOn(baselineUpdateConfig)

tasks.named('checkGradleJdkConfigs') {
    dependsOn 'generateGradleJdkConfigs'
}

def tomcatVersion = '10.1.49'

dependencies {
    implementation group: 'com.palantir.isofilereader', name: 'isofilereader', version: '0.6.2'

    // For dependencies
    implementation 'com.google.code.gson:gson:2.13.2'

    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-core', version: "$tomcatVersion"
    implementation group: 'org.apache.tomcat.embed', name: 'tomcat-embed-jasper', version: "$tomcatVersion"
    implementation group: 'org.apache.tomcat', name: 'tomcat-jasper', version: "$tomcatVersion"
    implementation group: 'org.apache.tomcat', name: 'tomcat-jasper-el', version: "$tomcatVersion"
    implementation group: 'org.apache.tomcat', name: 'tomcat-jsp-api', version: "$tomcatVersion"

    testImplementation('io.github.glytching:junit-extensions:2.6.0')
    testImplementation('org.hamcrest:hamcrest-integration:1.3')
    testImplementation(platform('org.junit:junit-bom:6.0.1'))
    testImplementation('org.junit.jupiter:junit-jupiter')
}

test {
    useJUnitPlatform()
}

jdks {
    daemonTarget = 21
}

javaVersions {
    javaCompiler = 21
    libraryTarget = 21
    runtime = 21
}
